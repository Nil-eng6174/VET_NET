<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KrishiCare - Landing & Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "primary": "#001b44",
                "primary-container": "#002f6c",
                "on-primary": "#ffffff",
                "surface": "#faf9ff",
                "surface-bright": "#ffffff",
                "surface-container": "#eeedf3",
                "surface-container-low": "#f4f3f9",
                "on-surface": "#1a1b20",
                "on-surface-variant": "#434750",
                "outline-variant": "#c4c6d2",
                "border-subtle": "#DEE2E6",
                "status-success": "#008000"
        }
      }
    }
  }
</script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 1);
            border: 1px solid var(--tw-colors-border-subtle);
            box-shadow: 0px 4px 24px rgba(0, 0, 0, 0.04);
        }
        .aadhaar-input {
            letter-spacing: 0.2em;
            font-family: monospace;
        }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col relative overflow-y-auto">
<!-- Decorative Background -->
<div class="absolute inset-0 z-0 pointer-events-none flex">
<div class="w-1/2 h-full bg-primary opacity-5"></div>
<div class="w-1/2 h-full bg-surface-container opacity-5"></div>
</div>
<!-- Header -->
<header class="w-full h-16 bg-primary flex justify-between items-center px-4 md:px-6 z-50 relative">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">agriculture</span>
<span class="text-2xl font-bold text-on-primary font-['Manrope']">KrishiCare</span>
</div>
<div class="hidden md:flex flex-col items-end text-on-primary">
<span class="text-xs opacity-80 uppercase tracking-widest font-['Hanken_Grotesk']">Department of Animal Husbandry</span>
<span class="text-xs opacity-80 uppercase tracking-widest font-['Hanken_Grotesk']">Government of India</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-4 md:p-6 z-10 relative">
<div class="w-full max-w-lg glass-card rounded-xl overflow-hidden flex flex-col">
<!-- Context Header -->
<div class="bg-surface-bright border-b border-border-subtle p-6 text-center">
<h1 class="text-3xl text-primary font-bold font-['Manrope']">Welcome</h1>
<p class="text-base text-on-surface-variant mt-1 font-['Hanken_Grotesk']">Secure access to veterinary services</p>
</div>
<div class="p-6 flex flex-col gap-6">
<!-- Role Selector -->
<div class="flex bg-surface-container-low p-1 rounded-lg border border-border-subtle" role="group">
<button class="flex-1 py-2 text-center text-sm bg-white text-primary shadow-sm border border-border-subtle rounded flex items-center justify-center gap-2 transition-all font-medium" id="btn-farmer" onclick="selectRole('Farmer')">
<span class="material-symbols-outlined text-primary">agriculture</span>
                        Farmer
                    </button>
<button class="flex-1 py-2 text-center text-sm text-on-surface-variant hover:text-primary rounded flex items-center justify-center gap-2 transition-all font-medium" id="btn-vet" onclick="selectRole('Veterinarian')">
<span class="material-symbols-outlined">medical_services</span>
                        Veterinarian
                    </button>
</div>
<!-- Forms Container -->
<div class="relative" id="form-container">
<!-- Login Form -->
<form class="flex flex-col gap-6 transition-opacity duration-300" id="form-login">
<div>
<label class="block text-sm text-on-surface mb-1 font-medium" for="login-aadhaar">Aadhaar Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">fingerprint</span>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-surface-bright aadhaar-input text-center font-bold text-lg text-on-surface" id="login-aadhaar" maxlength="14" oninput="formatAadhaar(this)" placeholder="XXXX XXXX XXXX" type="text"/>
</div>
</div>
<div>
<label class="block text-sm text-on-surface mb-1 font-medium" for="login-otp">OTP</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">password</span>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-surface-bright tracking-widest text-center font-bold text-on-surface" id="login-otp" maxlength="6" placeholder="• • • • • •" type="text" value="123456"/>
</div>
<div class="flex justify-end mt-1">
<button class="text-xs text-primary hover:underline" type="button">Resend OTP</button>
</div>
</div>
<button onclick="login()" class="w-full bg-primary hover:bg-primary-container text-white text-sm py-3 rounded mt-2 transition-colors flex items-center justify-center gap-2 shadow-sm font-medium" type="button">
                            Login <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="text-center mt-2">
<span class="text-base text-on-surface-variant">Don't have an account? </span>
<button class="text-sm text-primary hover:underline font-bold" onclick="toggleView('register')" type="button">Register Now</button>
</div>
</form>
<!-- Registration Form (Hidden by Default) -->
<form class="hidden flex-col gap-6 transition-opacity duration-300" id="form-register">
<div>
<label class="block text-sm text-on-surface mb-1 font-medium" for="reg-name">Full Name</label>
<input class="w-full px-3 py-3 border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-surface-bright text-on-surface" id="reg-name" placeholder="As per Aadhaar" type="text"/>
</div>
<div>
<label class="block text-sm text-on-surface mb-1 font-medium" for="reg-aadhaar">Aadhaar Number</label>
<input class="w-full px-3 py-3 border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-surface-bright aadhaar-input text-center font-bold text-on-surface" id="reg-aadhaar" maxlength="14" oninput="formatAadhaar(this)" placeholder="XXXX XXXX XXXX" type="text"/>
</div>
<div>
<label class="block text-sm text-on-surface mb-1 font-medium" for="reg-mobile">Mobile Number</label>
<div class="flex">
<span class="inline-flex items-center px-3 border border-r-0 border-outline-variant rounded-l bg-surface-container-low text-on-surface-variant">+91</span>
<input class="w-full px-3 py-3 border border-outline-variant rounded-r focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-surface-bright text-on-surface" id="reg-mobile" placeholder="99999 99999" type="tel"/>
</div>
</div>
<div class="hidden" id="vet-email-group">
<label class="block text-sm text-on-surface mb-1 font-medium" for="reg-email">Official Email (Veterinarian)</label>
<input class="w-full px-3 py-3 border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-surface-bright text-on-surface" id="reg-email" placeholder="vet@gov.in" type="email"/>
</div>
<div>
<label class="block text-sm text-on-surface mb-1 font-medium" for="reg-locality">Locality / District</label>
<select class="w-full px-3 py-3 border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-surface-bright appearance-none text-on-surface" id="reg-locality">
<option disabled="" selected="" value="">Select District</option>
<option value="Pune">Pune</option>
<option value="Satara">Satara</option>
<option value="Sangli">Sangli</option>
<option value="Kolhapur">Kolhapur</option>
<option value="Solapur">Solapur</option>
<option value="Nashik">Nashik</option>
<option value="Ahmednagar">Ahmednagar</option>
<option value="Raigad">Raigad</option>
<option value="Ratnagiri">Ratnagiri</option>
<option value="Sindhudurg">Sindhudurg</option>
</select>
</div>
<button onclick="register()" class="w-full bg-primary hover:bg-primary-container text-white text-sm py-3 rounded mt-2 transition-colors flex items-center justify-center gap-2 shadow-sm font-medium" type="button">
                            Register <span class="material-symbols-outlined text-[18px]">how_to_reg</span>
</button>
<div class="text-center mt-2">
<span class="text-base text-on-surface-variant">Already have an account? </span>
<button class="text-sm text-primary hover:underline font-bold" onclick="toggleView('login')" type="button">Login</button>
</div>
</form>
</div>
</div>
<!-- Security Footer -->
<div class="bg-surface-container-lowest p-3 border-t border-border-subtle flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-status-success">lock</span>
<span class="text-xs font-medium">Secured by Government of India Auth</span>
</div>
</div>
</main>
<script>
        let currentRole = 'Farmer';

        function formatAadhaar(input) {
            let val = input.value.replace(/\D/g, '');
            let formatted = '';
            for (let i = 0; i < val.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += val[i];
            }
            input.value = formatted;
        }

        function selectRole(role) {
            currentRole = role;
            const btnFarmer = document.getElementById('btn-farmer');
            const btnVet = document.getElementById('btn-vet');
            const vetEmailGroup = document.getElementById('vet-email-group');

            btnFarmer.className = 'flex-1 py-2 text-center text-sm text-on-surface-variant hover:text-primary rounded flex items-center justify-center gap-2 transition-all font-medium';
            btnVet.className = 'flex-1 py-2 text-center text-sm text-on-surface-variant hover:text-primary rounded flex items-center justify-center gap-2 transition-all font-medium';
            
            btnFarmer.querySelector('.material-symbols-outlined').classList.remove('text-primary');
            btnVet.querySelector('.material-symbols-outlined').classList.remove('text-primary');

            if (role === 'Farmer') {
                btnFarmer.className = 'flex-1 py-2 text-center text-sm bg-white text-primary shadow-sm border border-border-subtle rounded flex items-center justify-center gap-2 transition-all font-medium';
                btnFarmer.querySelector('.material-symbols-outlined').classList.add('text-primary');
                vetEmailGroup.classList.add('hidden');
            } else {
                btnVet.className = 'flex-1 py-2 text-center text-sm bg-white text-primary shadow-sm border border-border-subtle rounded flex items-center justify-center gap-2 transition-all font-medium';
                btnVet.querySelector('.material-symbols-outlined').classList.add('text-primary');
                vetEmailGroup.classList.remove('hidden');
            }
        }

        function toggleView(view) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            if (view === 'register') {
                formLogin.style.opacity = '0';
                setTimeout(() => {
                    formLogin.classList.add('hidden');
                    formLogin.classList.remove('flex');
                    formRegister.classList.remove('hidden');
                    formRegister.classList.add('flex');
                    setTimeout(() => formRegister.style.opacity = '1', 50);
                }, 300);
            } else {
                formRegister.style.opacity = '0';
                setTimeout(() => {
                    formRegister.classList.add('hidden');
                    formRegister.classList.remove('flex');
                    formLogin.classList.remove('hidden');
                    formLogin.classList.add('flex');
                    setTimeout(() => formLogin.style.opacity = '1', 50);
                }, 300);
            }
        }
        
        document.getElementById('form-register').style.opacity = '0';

        // API Wiring
        function login() {
            const aadhaar = document.getElementById('login-aadhaar').value.replace(/\s/g, '');
            const otp = document.getElementById('login-otp').value;

            if(otp !== '123456') {
                alert("Invalid OTP! Use 123456 for prototype.");
                return;
            }

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ role: currentRole, aadhaar: aadhaar, otp: otp })
            }).then(r => r.json()).then(data => {
                if(data.success) {
                    window.location.href = currentRole === 'Farmer' ? '/farmer' : '/vet';
                } else {
                    alert(data.message);
                }
            });
        }

        function register() {
            const data = {
                role: currentRole,
                name: document.getElementById('reg-name').value,
                aadhaar: document.getElementById('reg-aadhaar').value.replace(/\s/g, ''),
                mobile: document.getElementById('reg-mobile').value,
                locality: document.getElementById('reg-locality').value,
                email: document.getElementById('reg-email').value
            };

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(r => r.json()).then(res => {
                if(res.success) {
                    alert("Registration successful! You can now login.");
                    toggleView('login');
                } else {
                    alert(res.message);
                }
            });
        }
    </script>
</body></html>
